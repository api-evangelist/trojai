apis:
- name: TrojAI Platform API
  description: >-
    RESTful JSON API to manage the TrojAI platform programmatically (users, groups,
    roles/permissions, datasets, models, firewall policies/configs, firewall events,
    red team jobs and results, and secrets) — designed to be driven from an MLOps or
    CI/CD pipeline. Authenticated with an API key in the x-trojai-api-key header. The
    platform is self-hosted (Cloud or Enterprise), so the host is per-deployment and a
    per-tenant Swagger UI is served at https://<your_trojai_host>/docs.
  humanURL: https://docs.troj.ai/reference/eng-api
  baseURL: https://your-trojai-host.example/api/v2
  x-base-url-note: >-
    Host is per-tenant (self-hosted Cloud/Enterprise). The documented base path is
    /api/v2 on the deployment host (https://<your_trojai_host>); there is no single
    public production host.
