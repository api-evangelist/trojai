name: TrojAI
description: >-
  TrojAI is an enterprise AI security platform (acquired by A10 Networks) that lets
  organizations deploy AI models and agents safely. Its two products — TrojAI Detect
  (generative-AI red teaming, model robustness stress-testing, and integrity/risk
  audits for tabular and NLP models) and TrojAI Defend (a runtime firewall / proxy
  that inspects prompts and tool calls for prompt injection, jailbreaks, data leakage,
  toxic content, and rogue MCP/tool abuse) — are managed through a self-hosted RESTful
  platform API (/api/v2, authenticated with the x-trojai-api-key header), a Firewall
  Proxy API, a Python SDK (trojai-sdk), and a Keycloak-backed web application. It
  deploys as Cloud or Enterprise (Helm/Kubernetes).
