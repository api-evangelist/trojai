  - version: 2.17.0
    date: '2026-06-18'
    highlights:
      - Defend request rate limiting
      - Configurable event retention and compression (separate PASS/non-PASS retention)
      - Guardrail status-code mapping and streaming (SSE) support for custom Detect targets
      - Default MCP input handler; Earlybird secret detection rule
      - Keycloak 26 upgrade (invalidates existing API keys), Vault cloud auto-unseal, CVE remediation
      - OpenAI Integration Compliance Logs API upgraded to v2
    breaking:
      - Existing API keys are invalidated after the Keycloak 26 upgrade and must be recreated
      - Source Code detection rule and PII Monitor with Context rule removed from the rule catalog
